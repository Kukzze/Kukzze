<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="45%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080e1e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="95%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04" />
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "Cascadia Code", "Fira Code", Consolas, "JetBrains Mono", monospace; }
  </style>

  <!-- Background Layers -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#cyanGlow)" />
  <rect width="1200" height="380" fill="url(#purpleGlow)" />
  <rect width="1200" height="380" fill="url(#grid)" />

  <!-- Top Accent Border -->
  <rect x="0" y="0" width="1200" height="2.5" fill="url(#accentLine)" />

  <!-- LEFT COLUMN: Identity & Bio -->
  <g transform="translate(60, 52)">
    <!-- Eyebrow Pill -->
    <g>
      <rect x="0" y="0" width="245" height="28" rx="14" fill="#0369a1" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="14" r="3.5" fill="#38bdf8" filter="url(#glow)" />
      <text x="26" y="18" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">FOUNDER &amp; SYSTEMS ARCHITECT</text>
    </g>

    <!-- Status Text -->
    <text x="268" y="18.5" fill="#34d399" class="font-mono" font-size="11" font-weight="600" letter-spacing="0.5">✦ MONGODB COHORT &amp; NVIDIA INCEPTION</text>

    <!-- Main Title -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" fill="url(#textGrad)" class="font-sans" font-size="52" font-weight="900" letter-spacing="-1.5">DAKSH RAWAT</text>
      <text x="420" y="-8" fill="#64748b" class="font-mono" font-size="20" font-weight="600">@kukzze</text>
    </g>

    <!-- Mission & Bio -->
    <text x="0" y="104" fill="#94a3b8" class="font-sans" font-size="16.5" font-weight="500">
      Building <tspan fill="#ffffff" font-weight="700">Chic Builder</tspan> — adaptive workout progression &amp; volume intelligence,
    </text>
    <text x="0" y="129" fill="#94a3b8" class="font-sans" font-size="16.5" font-weight="500">
      and contributing upstream to global engines across <tspan fill="#38bdf8" font-weight="600">Rust</tspan>, <tspan fill="#f59e0b" font-weight="600">Java</tspan>, and <tspan fill="#60a5fa" font-weight="600">TypeScript</tspan>.
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 162)">
      <!-- Badge 1: MongoDB -->
      <g>
        <rect x="0" y="0" width="195" height="34" rx="8" fill="#00ed64" fill-opacity="0.08" stroke="#00ed64" stroke-width="1" stroke-opacity="0.35" />
        <circle cx="16" cy="17" r="4" fill="#00ed64" filter="url(#glow)" />
        <text x="28" y="21" fill="#d1fae5" class="font-sans" font-size="12" font-weight="700">MongoDB for Startups</text>
      </g>

      <!-- Badge 2: NVIDIA -->
      <g transform="translate(207, 0)">
        <rect x="0" y="0" width="180" height="34" rx="8" fill="#76b900" fill-opacity="0.08" stroke="#76b900" stroke-width="1" stroke-opacity="0.35" />
        <circle cx="16" cy="17" r="4" fill="#76b900" filter="url(#glow)" />
        <text x="28" y="21" fill="#ecfccb" class="font-sans" font-size="12" font-weight="700">NVIDIA Inception</text>
      </g>

      <!-- Badge 3: Upstream OSS -->
      <g transform="translate(399, 0)">
        <rect x="0" y="0" width="240" height="34" rx="8" fill="#0284c7" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" />
        <circle cx="16" cy="17" r="4" fill="#38bdf8" filter="url(#glow)" />
        <text x="28" y="21" fill="#e0f2fe" class="font-sans" font-size="12" font-weight="700">Upstream: Biome • PaperMC</text>
      </g>
    </g>

    <!-- Bottom Telemetry Line -->
    <g transform="translate(0, 230)">
      <text x="0" y="0" fill="#475569" class="font-mono" font-size="11" font-weight="600">
        RUNTIME: <tspan fill="#38bdf8">Next.js 15 App Router</tspan> • DB: <tspan fill="#34d399">Atlas Distributed Serverless</tspan> • SENTINEL: <tspan fill="#818cf8">mongo-next-sentinel (npm)</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Interactive Cockpit Diagnostic Window -->
  <g transform="translate(755, 46)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="385" height="285" rx="14" fill="#0c1322" fill-opacity="0.82" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
    
    <!-- Terminal Titlebar -->
    <path d="M 0 14 Q 0 0 14 0 L 371 0 Q 385 0 385 14 L 385 38 L 0 38 Z" fill="#131d33" />
    <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
    <circle cx="34" cy="19" r="4.5" fill="#eab308" />
    <circle cx="48" cy="19" r="4.5" fill="#22c55e" />
    <text x="68" y="23" fill="#64748b" class="font-mono" font-size="11" font-weight="700">// TELEMETRY_FEED.sh</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 65)">
      <text x="0" y="0" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700">kukzze@sentinel:~$</text>
      <text x="135" y="0" fill="#cbd5e1" class="font-mono" font-size="11">sys --inspect</text>

      <!-- Row 1 -->
      <text x="0" y="30" fill="#64748b" class="font-mono" font-size="11">VENTURE</text>
      <text x="80" y="30" fill="#38bdf8" class="font-mono" font-size="11" font-weight="600">chic-builder.vercel.app</text>

      <!-- Row 2 -->
      <text x="0" y="55" fill="#64748b" class="font-mono" font-size="11">AUDIENCE</text>
      <text x="80" y="55" fill="#e2e8f0" class="font-mono" font-size="11" font-weight="600">22.8k+ Athletes (@kukzze)</text>

      <!-- Row 3 -->
      <text x="0" y="80" fill="#64748b" class="font-mono" font-size="11">PACKAGE</text>
      <text x="80" y="80" fill="#34d399" class="font-mono" font-size="11" font-weight="600">mongo-next-sentinel (v1.0)</text>

      <!-- Row 4 -->
      <text x="0" y="105" fill="#64748b" class="font-mono" font-size="11">UPSTREAM</text>
      <text x="80" y="105" fill="#e2e8f0" class="font-mono" font-size="11" font-weight="600">10+ Merged / Passing CI</text>

      <!-- Divider -->
      <line x1="0" y1="126" x2="345" y2="126" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

      <!-- Active Stack Tags -->
      <g transform="translate(0, 146)">
        <text x="0" y="0" fill="#475569" class="font-mono" font-size="10" font-weight="700">CORE STACK ENGINES</text>
        <g transform="translate(0, 12)">
          <rect x="0" y="0" width="72" height="22" rx="4" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="10" y="15" fill="#93c5fd" class="font-mono" font-size="10">Next.js 15</text>

          <rect x="78" y="0" width="80" height="22" rx="4" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="86" y="15" fill="#38bdf8" class="font-mono" font-size="10">TypeScript</text>

          <rect x="164" y="0" width="54" height="22" rx="4" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="174" y="15" fill="#f97316" class="font-mono" font-size="10">Rust</text>

          <rect x="224" y="0" width="54" height="22" rx="4" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="236" y="15" fill="#facc15" class="font-mono" font-size="10">Java</text>

          <rect x="284" y="0" width="56" height="22" rx="4" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="294" y="15" fill="#34d399" class="font-mono" font-size="10">Atlas</text>
        </g>
      </g>
    </g>
  </g>
</svg>
