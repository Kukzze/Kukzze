  <text x="30" y="80" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="-.6" fill="#141a2e">chic-core</text>
  <text x="30" y="110" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#4b5468">Biomechanics calculation engine</text>
  <line x1="30" y1="128" x2="560" y2="128" stroke="#d5dbe7"/>
  <text x="30" y="152" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#141a2e" fill-opacity=".86"><tspan fill="#0e7490">▸ </tspan>Rep velocity-loss tracking</text><text x="30" y="177" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#141a2e" fill-opacity=".86"><tspan fill="#0e7490">▸ </tspan>Multi-formula 1RM estimation models</text><text x="30" y="202" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#141a2e" fill-opacity=".86"><tspan fill="#0e7490">▸ </tspan>Offline PWA sync state machine</text>
  <g transform="translate(30,224)">
      <rect width="85.1" height="22" rx="11" fill="#3178c6" fill-opacity=".12" stroke="#3178c6" stroke-opacity=".45"/>
      <text x="42.55" y="15" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="11" fill="#3178c6">typescript</text>
    </g><g transform="translate(123.1,224)">
