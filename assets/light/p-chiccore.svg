  <rect x=".5" y=".5" width="589" height="269" rx="14" fill="url(#pchiccoresvg-orb)"/>
  <rect x=".5" y=".5" width="589" height="269" rx="14" fill="none" stroke="url(#pchiccoresvg-border)" stroke-width="1"/>
