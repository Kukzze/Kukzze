<svg xmlns="http://www.w3.org/2000/svg" width="590" height="270" viewBox="0 0 590 270" role="img" aria-label="chic-core — Biomechanics calculation engine">
  <title>chic-core — Biomechanics calculation engine</title>
  <defs>
    <linearGradient id="pchiccoresvg-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#d5dbe7" stop-opacity=".6"/>
      <stop offset="1" stop-color="#5b63e6" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="pchiccoresvg-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <radialGradient id="pchiccoresvg-orb" cx=".85" cy="0" r=".9">
      <stop offset="0" stop-color="#0e7490" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pchiccoresvg-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0b1020" stroke-opacity=".035"/>
    </pattern>
    <filter id="pchiccoresvg-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .9 } 100% { transform: scale(3.2); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important } }
  </style>
  
  <rect x=".5" y=".5" width="589" height="269" rx="14" fill="url(#pchiccoresvg-glass)"/>
